<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kasur vs Bantal - Lazy Night</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div class="game-wrapper">
        <div id="game-container"></div>
        
        <div class="game-info">
            <div class="score-card">
                <span class="icon">🛏️</span>
                <span id="score-display">0</span>
            </div>
            <div class="timer-card">
                <span class="icon">⏱️</span>
                <span id="timer-display">30</span>
            </div>
            <button id="reset-button">🌙 MULAI ULANG 🌙</button>
        </div>
        
        <div class="instruction">
            🎮 <strong>Cara Main:</strong> Geser mouse ← → atau sentuh layar untuk menggerakkan kasur.<br>
            📌 Tangkap bantal sebanyak-banyaknya dalam 30 detik!
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
