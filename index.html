<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kasur vs Bantal - Lazy Night</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div class="game-wrapper">
        <div id="game-container"></div>
        
        <div class="game-info">
            <div class="score-card">
                <span class="icon">🛏️</span>
                <span id="score-display">0</span>
            </div>
            <div class="timer-card">
                <span class="icon">⏱️</span>
                <span id="timer-display">30</span>
            </div>
            <button id="reset-button">🌙 MULAI ULANG 🌙</button>
        </div>
    </div>

    <!-- MODAL GAME OVER -->
    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⏰</span>
                <h2>GAME OVER</h2>
            </div>
            <div class="modal-body">
                <div class="score-row">
                    <span class="score-label">✨ Skor Kamu</span>
                    <span class="score-value" id="final-score">0</span>
                </div>
                <div class="score-row highest">
                    <span class="score-label">🏆 Skor Tertinggi</span>
                    <span class="score-value" id="highest-score">0</span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-reset-btn">🌙 MAIN LAGI 🌙</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
